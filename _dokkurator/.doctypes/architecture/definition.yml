name: architecture
description: Describes the design and boundaries of a Dokkurator component.
metadata:
  type: object
  required:
    - title
    - status
  properties:
    title:
      type: string
    status:
      type: string
      enum: [draft, accepted]
    component:
      type: string
    tags:
      type: array
      items:
        type: string
structure:
  requiredHeadings:
    - Responsibilities
    - Boundaries

