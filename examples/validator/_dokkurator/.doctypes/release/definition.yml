name: release
description: Release-Notizen mit Version, Datum und eindeutigen Einträgen.
metadata:
  doctype: { const: release, required: true }
  title: { type: string, required: true }
  version:
    { type: string, pattern: "^[0-9]+[.][0-9]+[.][0-9]+$", required: true }
  released: { type: string, format: date, required: true }
  changes:
    type: array
    minItems: 1
    uniqueItems: true
    required: true
    items: { type: string, minLength: 1 }
structure:
  requiredHeadings: [Änderungen]
